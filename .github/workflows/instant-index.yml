name: Push to Google Indexing API
on:
  push:
    branches:
      - main
    paths:
      - 'src/posts/*.md'
  workflow_dispatch:
    inputs:
      url:
        description: 'Canonical URL to submit (leave empty to submit changed posts)'
        required: false
        type: string

jobs:
  index-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Needed to compare changes between commits

      - name: Ping Google Indexing API
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          MANUAL_URL: ${{ inputs.url }}
        run: |
          set -euo pipefail

          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ] || [ -z "$GOOGLE_REFRESH_TOKEN" ]; then
            echo "Required Google secrets are missing: GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_REFRESH_TOKEN"
            exit 1
          fi

          # 1. Find newly added or modified Markdown files
          if [ -n "$MANUAL_URL" ]; then
            URLS="$MANUAL_URL"
          else
            CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r "${{ github.sha }}" | grep '^src/posts/.*\.md$' || true)

            if [ -z "$CHANGED_FILES" ]; then
              echo "No new posts detected in this commit. Skipping."
              exit 0
            fi

            echo "Found modified posts: $CHANGED_FILES"
            URLS=""
            for FILE in $CHANGED_FILES; do
              SLUG=$(basename "$FILE" .md)
              URLS="$URLS https://clarifypost.dippan.com.np/posts/$SLUG/"
            done
          fi

          # 2. Generate a fresh Access Token using the Refresh Token
          TOKEN_RESPONSE=$(curl --fail-with-body -sS -X POST https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$GOOGLE_CLIENT_ID" \
            --data-urlencode "client_secret=$GOOGLE_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GOOGLE_REFRESH_TOKEN" \
            -d grant_type=refresh_token | jq -r '.access_token')

          if [ -z "$TOKEN_RESPONSE" ] || [ "$TOKEN_RESPONSE" = "null" ]; then
            echo "Google OAuth did not return an access token. Check the OAuth client and refresh token."
            exit 1
          fi

          # 3. Loop through files, create URLs, and ping Google
          for NEW_URL in $URLS; do
            echo "Requesting Google Indexing API for: $NEW_URL"

            RESPONSE=$(curl -sS -w '\n%{http_code}' -X POST https://indexing.googleapis.com/v3/urlNotifications:publish \
              -H "Authorization: Bearer $TOKEN_RESPONSE" \
              -H "Content-Type: application/json" \
              -d "{\"url\": \"$NEW_URL\", \"type\": \"URL_UPDATED\"}")
            HTTP_CODE=$(printf '%s' "$RESPONSE" | tail -n1)
            BODY=$(printf '%s' "$RESPONSE" | sed '$d')

            echo "Google API response code: $HTTP_CODE"
            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "Google API response: $BODY"
              exit 1
            fi
          done
